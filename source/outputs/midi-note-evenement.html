:root {

  --ds-body: var(--sans, "DM Sans", "Arial Nova", sans-serif);
  --ds-mono: var(--mono, "IBM Plex Mono", ui-monospace, monospace);

  --ds-breakpoint-tablet: 768px;

  --ds-radius-panel: 0;

  /* Interaction timing */
  --ds-duration-fast: 150ms;

  --ds-ease-standard: cubic-bezier(.2, .7, .2, 1);
  --ds-focus-ring: 0 0 0 3px rgba(255, 98, 84, .3);
