  <style>
    :root { color-scheme:dark; --paper:#0e1012; --ink:#f3f1eb; --muted:#aab1b2; --rule:#343b3e; --red:#ff321f; --red-soft:#ff6254; --teal:#b8c66b; --yellow:#d9a83b; --panel:#172333; --display:"Space Grotesk","Arial Nova","Segoe UI",sans-serif; --sans:"DM Sans","Arial Nova","Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { position:relative; isolation:isolate; margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 var(--sans); }
    body::before { position:fixed; z-index:-1; inset:0; background:linear-gradient(180deg,rgba(14,16,18,.9),rgba(14,16,18,.96)),url("UAD2.jpg") center 38%/cover no-repeat; content:""; pointer-events:none; }
    a { color:inherit; }

    :focus-visible { outline:3px solid var(--red-soft); outline-offset:4px; }

    .wordmark-symbol { width:36px; height:36px; display:grid; place-items:center; background:var(--red); }
    .wordmark-symbol svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:2; }
    .wordmark em { color:var(--yellow); font-style:normal; }
    .nav { display:flex; align-items:center; gap:clamp(15px,3vw,34px); }
    .nav a { min-height:44px; display:inline-flex; align-items:center; color:var(--muted); font-size:14px; text-decoration:none; }
    .nav a:hover,.nav a[aria-current="page"] { color:var(--ink); }

    .issue-tag { color:var(--muted); font:12px var(--mono); white-space:nowrap; }
    main { padding-bottom:76px; }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) 245px; align-items:end; gap:44px; padding:clamp(54px,9vw,108px) 0 52px; border-bottom:1px solid var(--rule); }
    .eyebrow,.micro-label { color:var(--teal); font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .eyebrow { margin-bottom:19px; }
    h1,h2,h3,p { margin-top:0; }

    .deck { max-width:650px; margin:0; color:var(--muted); font-size:clamp(17px,2vw,21px); line-height:1.55; }
    .hero-note { padding:15px 0 3px 17px; border-left:1px solid var(--teal); }
    .hero-note strong { display:block; margin:8px 0; color:var(--ink); font:500 22px var(--display); }
    .hero-note p { margin:0; color:var(--muted); font-size:13px; }
    .index-tools { padding:29px 0 22px; }
    .tool-top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:19px; }
    .tool-top h2 { margin:0; color:var(--ink); font:500 24px var(--display); letter-spacing:-.04em; }
    .result-count { color:var(--teal); font:11px var(--mono); }
    .search-wrap { position:relative; display:block; margin-bottom:17px; }
    .search-wrap > span:first-child { position:absolute; top:50%; left:14px; color:var(--teal); font:14px var(--mono); transform:translateY(-50%); pointer-events:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .search { width:100%; min-height:50px; padding:0 16px 0 42px; border:1px solid rgba(243,241,235,.22); border-radius:0; background:rgba(255,255,255,.035); color:var(--ink); }
    .search::placeholder { color:#879092; }
    .search:focus { border-color:var(--teal); outline:0; box-shadow:0 0 0 3px rgba(184,198,107,.12); }
    .filters { display:flex; flex-wrap:wrap; gap:8px; }
    .filter { min-height:39px; padding:0 12px; border:1px solid rgba(243,241,235,.18); background:rgba(255,255,255,.025); color:var(--muted); font:10px var(--mono); cursor:pointer; transition:color 150ms ease,border-color 150ms ease,background 150ms ease,transform 150ms ease; }
    .filter:hover { color:var(--ink); border-color:var(--yellow); transform:translateY(-1px); }
    .filter[aria-pressed="true"] { border-color:var(--teal); background:rgba(184,198,107,.12); color:var(--ink); box-shadow:inset 0 -2px var(--teal); }
    .terms { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:clamp(24px,5vw,64px); border-top:1px solid var(--rule); }
    .term { min-width:0; padding:24px 0 27px; border-bottom:1px solid var(--rule); animation:enter 350ms both; }
    @keyframes enter { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    .term-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; }
    .term-index { color:var(--red-soft); font:10px var(--mono); }
    .term-category { color:var(--teal); font:9px var(--mono); letter-spacing:.04em; text-transform:uppercase; text-align:right; }
    .term h3 { margin:0 0 8px; color:var(--ink); font:500 clamp(21px,2.7vw,28px)/1.12 var(--display); letter-spacing:-.045em; }
    .term p { max-width:58ch; margin:0; color:var(--muted); font-size:14px; line-height:1.65; }
    .term strong { color:var(--ink); font-weight:600; }
    .term[hidden] { display:none; }
    .term-foot a { color:var(--teal); text-decoration-thickness:1px; text-underline-offset:3px; }
    .term-foot { display:flex; gap:8px; margin-top:13px; color:#899193; font:9px var(--mono); }
    .term-foot span { padding:4px 7px; border:1px solid rgba(243,241,235,.12); }
    .empty { display:none; padding:38px 0; color:var(--muted); text-align:center; }
    .empty strong { display:block; margin-bottom:6px; color:var(--ink); font:500 22px var(--display); }
    .closing { display:grid; grid-template-columns:1fr auto; align-items:end; gap:28px; margin-top:70px; padding:30px 0 0; border-top:1px solid var(--ink); }
    .closing h2 { margin-bottom:10px; color:var(--yellow); font:500 clamp(30px,5vw,48px)/1 var(--display); letter-spacing:-.06em; }
    .closing p { max-width:650px; margin:0; color:var(--muted); }
    .closing a { color:var(--teal); font:11px var(--mono); text-underline-offset:4px; }
    footer { border-top:1px solid var(--rule); }
    .footer-inner { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; color:var(--muted); font-size:12px; }
    .footer-inner p { margin:0; }
    .footer-inner a { text-decoration:none; }
    @media (max-width:760px) { .hero { grid-template-columns:1fr; gap:28px; } .hero-note { max-width:420px; } }
    @media (max-width:600px) { .page { width:calc(100% - 36px); } .masthead-inner { min-height:68px; } .wordmark { gap:8px; font-size:20px; } .wordmark-symbol { width:32px; height:32px; } .wordmark-symbol svg { width:20px; height:20px; } .nav { gap:10px; } .nav a { font-size:11px; } .issue-tag { display:none; } .hero { padding:48px 0 34px; } h1 { font-size:clamp(51px,14vw,77px); } .hero-note { padding-left:13px; } .tool-top { align-items:flex-end; } .tool-top h2 { font-size:21px; } .filters { gap:6px; } .filter { min-height:38px; padding-inline:9px; font-size:9px; } .terms { grid-template-columns:1fr; } .term { padding:19px 0 22px; } .term h3 { font-size:25px; } .closing { grid-template-columns:1fr; gap:15px; margin-top:48px; } .footer-inner { min-height:66px; align-items:start; flex-direction:column; justify-content:center; padding:13px 0; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition-duration:.01ms!important; } .filter:hover { transform:none; } }

  <style id="frequences-design-system" data-version="2026-10-06.13">
/*
 * Fréquences — direction industrielle rouge, version 2026-10-06.3.
 * Source commune intégrée dans les HTML par scripts/sync_design_system.py.
 * Les couleurs des données des graphiques restent définies par chaque page.
 */
:root {
  /* Color roles */
  --ds-bg: #0e1012;
  --ds-surface: #101214;
  --ds-surface-raised: #1a1d20;
  --ds-text: #f3f1eb;
  --ds-text-muted: #aab1b2;
  --ds-line: #42494c;
  --ds-line-strong: #596165;
  --ds-red: #ff321f;
  --ds-red-soft: #ff6254;
  --ds-headline: #f3f1eb;

  /* Typography, 4px spacing scale, and shape */
  --ds-display: Arial, Helvetica, sans-serif;
  --ds-body: var(--sans, "DM Sans", "Arial Nova", sans-serif);
  --ds-mono: var(--mono, "IBM Plex Mono", ui-monospace, monospace);
  --ds-space-1: 4px;
  --ds-space-2: 8px;
  --ds-space-3: 12px;
  --ds-space-4: 16px;
  --ds-space-6: 24px;
  --ds-space-8: 32px;
  --ds-breakpoint-tablet: 768px;
  --ds-breakpoint-desktop: 1024px;
  --ds-radius-panel: 0;
  --ds-radius-control: 0;

  /* Interaction timing */
  --ds-duration-fast: 150ms;
  --ds-duration-standard: 230ms;
  --ds-ease-standard: cubic-bezier(.2, .7, .2, 1);
  --ds-focus-ring: 0 0 0 3px rgba(255, 98, 84, .3);
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 1rem;
}

body[data-design-system="red-industrial"] {
  background-color: var(--ds-bg);
  color: var(--ds-text);
  font-family: var(--ds-body);
}

/* Une portée explicite donne la priorité au système sur les styles locaux. */
body[data-design-system] :is(h1, h2, h3) {
  font-family: var(--ds-display);
  color: var(--ds-headline);
}

body[data-design-system] :is(h1, .article-section > h2, .dossier h2, .reading-head h2, .atelier h2) {
  color: var(--ds-headline);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -.055em;
  overflow-wrap: break-word;
}

body[data-design-system] h1 {
  line-height: .94;
}

body[data-design-system] .masthead {
  border-bottom-color: var(--ds-line);
  background: var(--ds-bg);
}

body[data-design-system] .wordmark {
  font-family: var(--ds-display);
  font-weight: 800;
  letter-spacing: -.045em;
  text-transform: uppercase;
}

body[data-design-system] .wordmark-symbol {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  overflow: visible;
  border-radius: 0;
  background: transparent;
  color: var(--ds-text);
  box-shadow: none;
}

body[data-design-system] .wordmark-symbol::after {
  display: none;
}

body[data-design-system] .wordmark-symbol svg {
  width: 28px;
  height: 28px;
  overflow: visible;
}

body[data-design-system] .wordmark-symbol .logo-rail {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
}

body[data-design-system] .wordmark-symbol .logo-slider {
  fill: none;
  stroke: var(--ds-red);
  stroke-width: 3.2;
  stroke-linecap: round;
}

@media (max-width: 600px) {
  body[data-design-system] .wordmark-symbol {
    width: 32px;
    height: 32px;
    flex-basis: 32px;
  }

  body[data-design-system] .wordmark-symbol svg {
    width: 24px;
    height: 24px;
  }
}

body[data-design-system] .wordmark em {
  color: var(--ds-red-soft);
}

body[data-design-system] .nav a {
  color: var(--ds-text);
  font: 500 11px/1.4 var(--ds-mono);
  letter-spacing: .06em;
  text-transform: uppercase;
}

body[data-design-system] .nav a:hover {
  color: var(--ds-red-soft);
}

/* L'accueil possède ses propres classes : elles sont couvertes explicitement. */
body[data-design-system] .cover {
  row-gap: 24px;
}

body[data-design-system] .cover h1 {
  grid-column: 1 / -1;
  max-width: none;
  margin-bottom: 0;
  font-family: "Arial Black", "Arial Nova", Arial, Helvetica, sans-serif;
  font-weight: 900;
  font-size: clamp(66px, 9.2vw, 132px);
  -webkit-text-stroke: .35px currentColor;
  line-height: .92;
  container-type: inline-size;
}

body[data-design-system] .cover-copy {
  display: flex;
  flex-direction: column;
}

body[data-design-system] .cover-title-line {
  display: flex;
  align-items: center;
  gap: clamp(6px, 1.2vw, 16px);
  white-space: nowrap;
  font-size: inherit;
  font-size: min(1em, calc((100cqw - 44px) / 7));
  line-height: .94;
  letter-spacing: -.055em;
}

body[data-design-system] .cover-title-word {
  flex: 0 0 auto;
}

body[data-design-system] .cover-title-line::before,
body[data-design-system] .cover-title-line::after {
  content: "";
  flex: 1 1 0;
  min-width: 8px;
  height: 2px;
  background: currentColor;
  opacity: .8;
  transform: scaleX(.8);
  transition: transform 280ms cubic-bezier(.16, 1, .3, 1), opacity 280ms ease;
}

body[data-design-system] .cover-title-line::before {
  transform-origin: right center;
}

body[data-design-system] .cover-title-line::after {
  transform-origin: left center;
}

body[data-design-system] .cover-title-line:first-child::before,
body[data-design-system] .cover-title-line:last-child::after {
  flex: 0 0 clamp(12px, 2vw, 28px);
}

@media (hover: hover) and (pointer: fine) {
  body[data-design-system] .cover-title-line:hover::before,
  body[data-design-system] .cover-title-line:hover::after {
    transform: scaleX(1);
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  body[data-design-system] .cover-title-line::before,
  body[data-design-system] .cover-title-line::after {
    transform: none;
    transition: none;
  }
}

body[data-design-system] .cover-deck {
  margin-top: 0;
}

@media (min-width: 981px) {
  body[data-design-system] .cover {
    grid-template-columns: minmax(0, 1.15fr) minmax(370px, .85fr);
    column-gap: clamp(28px, 4vw, 60px);
  }

  body[data-design-system] .cover-copy {
    max-width: none;
  }
}

body[data-design-system] .cover-figure {
  border: 1px solid var(--ds-line-strong);
  border-top: 3px solid var(--ds-red);
  border-radius: var(--ds-radius-panel);
  background: var(--ds-surface);
  box-shadow: none;
}

body[data-design-system] .cover-figure::before {
  border: 0;
}

body[data-design-system] .reference-reset {
  border-color: var(--ds-line-strong);
  border-radius: var(--ds-radius-control);
  background: transparent;
  color: var(--ds-text);
  text-transform: uppercase;
}

body[data-design-system] .reference-reset:hover {
  border-color: var(--ds-red-soft);
  color: var(--ds-red-soft);
}

/* Les deux cahiers : objectif, notions et entrée dans le parcours. */
body[data-design-system] .cover-start {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin-bottom: 14px;
  color: var(--ds-red-soft);
  font: 600 12px/1.4 var(--ds-mono);
  text-underline-offset: 5px;
}

body[data-design-system] .cahier-intro {
  padding-block: clamp(36px, 5vw, 64px);
  border-bottom: 1px solid var(--ds-line);
  scroll-margin-top: 24px;
}

body[data-design-system] .cahier-kicker {
  margin: 0 0 12px;
  color: var(--ds-red-soft);
  font: 11px/1.5 var(--ds-mono);
  letter-spacing: .06em;
  text-transform: uppercase;
}

body[data-design-system] .cahier-intro > h2 {
  margin: 0 0 16px;
  font-size: clamp(30px, 4.2vw, 52px);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -.045em;
  text-transform: uppercase;
}

body[data-design-system] .cahier-lead {
  max-width: 72ch;
  margin: 0 0 28px;
  color: var(--ds-text-muted);
  line-height: 1.6;
}

body[data-design-system] .cahier-grid {
  display
